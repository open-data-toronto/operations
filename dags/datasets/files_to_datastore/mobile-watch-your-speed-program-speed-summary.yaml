  excerpt: A summary of observed speeds for each location where a Mobile Watch Your
    Speed Program Sign was installed.
  limitations: "-\tData is only provided where the mobile sign installation has ended.\r\
    \n-\tThe count of number of vehicles is not equivalent to a traffic volume count.\r\
    \n-\tSpeed accuracy is \xB1 1 km/hr"
  notes: "The Mobile WYSP uses devices called speed display signs or driver feedback\
    \ signs which contain a radar device and an LED display. These signs are installed\
    \ against an existing hydro pole or streetlight. The radar measures the speeds\
    \ of oncoming vehicles and the LED sign displays their speeds to the passing motorists,\
    \ thereby reminding them to check their speeds and to obey speed limits. The City\u2019\
    s portable units are rotated throughout each ward on a monthly basis throughout\
    \ the year. This dataset contains a summary of observed speeds for each sign installation\
    \ and the operational parameters of the sign.  See [Mobile Watch Your Speed Program\
    \ \u2013 Detailed Speed Counts](https://open.toronto.ca/dataset/mobile-watch-your-speed-program-detailed-speed-counts/)\
    \ for hourly speed counts.\r\n"
