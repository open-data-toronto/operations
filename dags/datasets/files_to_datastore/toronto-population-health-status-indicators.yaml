  excerpt: 'Data used to measure health outcomes and behaviours at a population level. '
  limitations: null
  notes: "Population Health Status Indicators (PHSIs) summarize data used to measure\
    \ health outcomes and behaviours at a population level. They provide an overview\
    \ of health and well-being over time and across populations.\r\n\r\nToronto Public\
    \ Health (TPH) reports on a series of PHSIs to support its mission to reduce health\
    \ inequities and improve the health of the whole population. These indicators\
    \ can be searched by topic through interactive dashboards. They are analyzed over\
    \ time, by geography, and by socio-demographic characteristics.\r\n\r\nSupporting\
    \ data and additional supporting resources can be accessed accessed via the Download\
    \ link/button below\r\n"
