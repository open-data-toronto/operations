  collection_method: Data was collected through inspections and investigations initiated by routine operations or by complaints received.
  civic_issues: null
  topics: 
    - Public safety
    - Health
  tags:
  - name: inspection
    vocabulary_id: null
  - name: apartment
    vocabulary_id: null
  information_url: null
