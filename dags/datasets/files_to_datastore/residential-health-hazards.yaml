  limitations: null
  notes: Snapshot of the information to the public concerning the Toronto Public Health’s Health Hazard investigations. The data set is as current as the date of the extraction.
  resources:
    # resource name
    Residential Health Hazard Orders:
      format: json
      agol: true
      url: https://services3.arcgis.com/b9WvedVPoizGfvfD/arcgis/rest/services/COT_Toronto_Public_Health_Property_Violation/FeatureServer/0      
      datastore_upsert:
        primary_key: "primary_key"
      custom_reader: residential_health_hazards
      attributes:
        - id: primary_key
          type: text
          info:
            notes: "Unique id for this record, used to identify individual orders"
        - id: ISSUED_DATE
          type: date
          format: "%Y-%m-%d"
          info:
            notes: Date Order was issued.
        - id: GEO_ID
          type: text
          info:
            notes: Geospatial unique identifier for address.
        - id: LONGITUDE
          type: float
          info:
            notes: Latitude of address.
        - id: LATITUDE
          type: float
          info:
            notes: Longitude of address.
        - id: ADDRESS
          type: text
          info:
            notes: Address related to the record.
        - id: HEALTH_HAZARD
          type: text
          info:
            notes: Health hazard description.
        - id: CRSIR_NUMBER
          type: text
          info:
            notes: Request for service identification number.
        - id: PUBLIC_HEALTH_INSPECTOR
          type: text
          info:
            notes: Investigating Public Health Inspector.
        
        
        