  excerpt: A summary of observed speeds for each location where a Safety Zone Watch
    Your Speed Program Sign was installed.
  limitations: "-\tThe count of number of vehicles is not equivalent to a traffic\
    \ volume count.\r\n-\tSpeed accuracy is \xB1 1 km/hr\r\n"
  notes: "The WYSP uses devices called speed display signs or driver feedback signs\
    \ which contain a radar device and an LED display. These signs are installed against\
    \ an existing hydro pole or streetlight. The radar measures the speeds of oncoming\
    \ vehicles and the LED sign displays their speeds to the passing motorists, thereby\
    \ reminding them to check their speeds and to obey speed limits. The City\u2019\
    s permanent units are installed in Safety Zones. This dataset contains the monthly\
    \ summary of observed speeds for these signs. See [Detailed Speed Counts](https://open.toronto.ca/dataset/school-safety-zone-watch-your-speed-program-detailed-speed-counts/)\
    \ for hourly speed counts recorded by these signs and [Location Data](https://open.toronto.ca/dataset/school-safety-zone-watch-your-speed-program-locations/)\
    \ for details on where and when signs were installed."
