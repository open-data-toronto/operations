  limitations: null
  notes: "The addresses and intersections provided in the file are references to the\
    \ approximate locations of the Utility Cuts and do not represent the actual /\
    \ specific locations. For more information,  please visit the [Utility Cut Permit\
    \ Website](https://www.toronto.ca/services-payments/building-construction/infrastructure-city-construction/construction-standards-permits/utility-cut-permit-application/)\r\
    \n\r\n **Permit Status**:\r\n\r\n-  **PERMIT ISSUED**: Application Approved -\
    \ Permit Issued to Utility permission granted to carry out work\r\n-  **ENTERED**:\
    \ Permit application is active and no permit is issued yet\r\n-  **CANCELLED**:\
    \ Permit was cancelled due to various reasons\r\n-  **REFUSED/MCR-Noncompliant**:\
    \ Permit was refused due to various reasons\r\n-  **PLANNED**: Utility Cut Examination\
    \ completed, Planned restoration of sidewalk or Roadway resulting from Utility\
    \ Cut activity\r\n-  **ACTIVE**:Permanent restoration of sidewalk or Road in progress\r\
    \n-  **COMPLETED**: Permanent restoration work is completed\r\n-  **NO FURTHER\
    \ WORK REQUIRED**: No hard surface restoration work is required\r\n-  **UNDER\
    \ WARRANTY/WARRANTY EXPIRED/POST WARRANTY INSPECTED/WARRANTY INSPECTION FAILED/PASSED**:\
    \ Various status of the permanent restoration work conducted by the Utility Companies\r\
    \n"
