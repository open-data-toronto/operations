  notes: "This dataset includes information relating to the registration of deaths\r\
    \ndocumented by Registry Services staff located in four of the civic centres\r\
    \n(Scarborough, North York, Toronto and Etobicoke). Registration of death data\r\
    \nis entered into the Registry Services Tracking System (RSTS), from which\r\n\
    aggregate statistical information is generated to create the dataset. The\r\n\
    dataset resides in an Oracle database in the City's environment.\r\n\r\nThe dataset\
    \ is created in support of the Vital Statistics Act, which is a\r\nProvincial\
    \ legislation. The dataset also supports the City's operational\r\nrequirements\
    \ and business functions.\r\n\r\nSee readme file\r\n\r\n"
