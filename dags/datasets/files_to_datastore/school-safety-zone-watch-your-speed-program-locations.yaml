  excerpt: The locations and operating parameters for each location where a permanent
    Watch Your Speed Program Sign was installed.
  limitations: "-\tSign addresses have not been verified. They may represent the address\
    \ of the property adjacent to the sign, which may not be on the same street as\
    \ the sign. \r\n-\tThe speed limit column is reflective of the most recent operating\
    \ parameter and does not necessarily the current or previous speed limit at that\
    \ location\r\n\r\n"
  notes: "The WYSP uses devices called speed display signs or driver feedback signs\
    \ which contain a radar device and an LED display. These signs are installed on\
    \ a dedicated wooden pole. The radar measures the speeds of oncoming vehicles\
    \ and the LED sign displays their speeds to the passing motorists, thereby reminding\
    \ them to check their speeds and to obey speed limits. The City\u2019s permanent\
    \ units are installed in Safety Zones. This dataset contains the locations and\
    \ operating parameters for installed signs. See [Detailed Speed Counts](https://open.toronto.ca/dataset/school-safety-zone-watch-your-speed-program-detailed-speed-counts/)\
    \ for hourly speed counts recorded by these signs and [Monthly Summary Data](https://open.toronto.ca/dataset/safety-zone-watch-your-speed-program-monthly-summary/)\
    \ for a monthly summary of these speed data\r\n\r\nSee here for more: https://www.toronto.ca/services-payments/streets-parking-transportation/road-safety/vision-zero/safety-initiatives/safety-zones/"
