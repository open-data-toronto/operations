  excerpt: This dataset includes information about appeals to the Toronto Appeal Body for decisions of the Committee of Adjustment on minor variances to zoning by laws and consents
  limitations: null
  notes: |
    This dataset includes information about appeals submitted to the Toronto Appeal Body for decisions of the committee of Adjustments on minor variances to zoning by-laws and consents.

    In 2017, City Council passed [Toronto Municipal Code Chapter 142](https://www.toronto.ca/legdocs/municode/toronto-code-142.pdf) and created the Toronto Local Appeal Body (TLAB). The TLAB has Council appointed members who will make decisions about local planning matters affecting Toronto Neighbourhoods in a fair, consistent, fact-based and informed manner. Appeal hearings are public.
  resources:
    Local Appeal Body Appeals:
      format: csv
      url: https://opendata.toronto.ca/court.services/toronto-local-appeal-body-appeals/tlab_appeals.csv
      attributes:
      - id: TLABFOLDER
        type: text
        info:
          notes: Associated IBMS (internal city system) Folder ID
      - id: FOLDERNUMBER
        type: text
        info:
          notes: Associated detailed IBMS (internal city system) Folder ID
      - id: INDATE
        type: text
        info:
          notes: Date the appeal was brought in
      - id: FINALDATE
        type: text
        info:
          notes: Last date the appeal was updated
      - id: STATUS
        type: text
        info:
          notes: Status of the appeal
      - id: FOLDERNAME
        type: text
        info:
          notes: Name of the folder - often related to an address
      - id: DISTRICT
        type: text
        info:
          notes: Former municipality name associated with the appeal 
      