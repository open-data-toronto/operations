  notes: |
    A directory of Toronto-based musicians available for live music events.

    Genres include: afrobeat, ambient, blues, children’s music, classical, country, covers, dance/EDM, electronic, experimental, folk, funk, global, hip hop/rap, indie, instrumental, jazz, Latin, pop, punk, R&B/soul, reggae, rock, roots, singer/songwriter and vocal/acapella.

    Musicians can apply to be included in the City of Toronto’s Musician Directory by visiting [Musician Opportunities](https://www.toronto.ca/business-economy/industry-sector-support/music/support-opportunities/musician-opportunities/) and completing an application form.
  
