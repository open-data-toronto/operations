  information_url: https://www.toronto.ca/city-government/accountability-operations-customer-service/city-administration/city-managers-office/agencies-corporations/agencies/association-of-community-centres/
  excerpt: Geographical locations of all City-owned Association of Community Centres (AOCCs), listed under agency name of registered organization running community-based programming and services.
  limitations: null
  collection_method: This layer was created manually in ArcGIS Pro to represent the geographic locations of the Association of Community Centres (AOCCS) for the City of Toronto. Source information was obtained from publicly available municipal records and the official AOCC webpage. Each AOCC location was georeferenced using address-based input and verified through cross-referencing with Google Maps. Point features were digitized manually using the “Create Features” tool in ArcGIS Pro, with attribute fields including AOCC name, address, contact information and mandate or mission statement. This layer is intended for use in municipal planning, community engagement and analysis.

  notes: |
    The City has a number of community centres that are managed, operated and maintained by volunteer Boards of Management, which are collectively referred to as the Association of Community Centres (AOCCs).

    The community centres are multi-purpose facilities that provide public space, programs and services to meet the recreation and social needs of local communities. They are committed to fostering a sense of community, promoting civic engagement and enhancing the quality of life through their community, recreational and social service programs.

    The core administrative activities of the community centres are funded by the City while the program component is funded through fees, donations and grants.
