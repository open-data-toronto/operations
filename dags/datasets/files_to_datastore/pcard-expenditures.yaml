  schedule: '45 2 1 * 4'
  dag_owner_name: Mackenzie.Nichols4
  dag_owner_email: mackenzie.nichols4@toronto.ca
  title: Parking Occupancy
  date_published: '2011-06-29 00:37:16.207118'
  dataset_category: Table
  refresh_rate: Monthly
  owner_division: Acounting Services
  owner_section: null
  owner_unit: null
  owner_email: pcard@toronto.ca
  civic_issues: 
    - Fiscal responsibility
  topics:
  - City governance
  - Finance
  tags:
  - name: credit card
    vocabulary_id: null
  
  information_url: https://www.toronto.ca/city-government/budget-finances/
  excerpt: The dataset contains details of all purchases made by City staff members using City-issued credit cards also referred to as PCards or purchasing cards.
  limitations: 2024 data is not aggregated by quarter but by the entire year.
  notes: |
    Council PCard expenses are not included in this report. Councillor expenses are disclosed separately through the quarterly Councillor Office Expense Reports.

    PCard expenses for the Offices of the Auditor General, Integrity Commissioner, Lobbyist Registrar and Ombudsman are not included as part of this report. PCard expenses for these offices are posted separately on the websites of the Offices of the Auditor General, Integrity Commissioner, Lobbyist Registrar and Ombudsman.

  resources: 
    PCard Expenses:
      format: xls
      url: https://opendata.toronto.ca/accounting.services/pcard-expenditures/expenditures/PCardExpenses_yyyymm.xls
      custom_reader: pcard_expenditures
      attributes:
        - id: Car Park Number
          type: "text"
          info:
            notes: "Unique identifier for each parking facility."
        - id: Car Park Location
          type: "text"
          info:
            notes: "Address of the car park."
        - id: Total Available Spaces
          type: "text"
          info:
            notes: "Count of spaces available for parking."
        - id: Average Daily Peak Occupancy %
          type: "text"
          info:
            notes: "Average daily peak occupancy is the primary utilization metric employed by TPA. It is derived from paid parking transactions and calculated by taking the highest number of transactions recorded each day, dividing by location capacity to get a daily peak percentage, then averaging these percentages over the total number of days in the reported period (e.g., 90 days for a quarterly report)."
        - id: Year
          type: "text"
          info:
            notes: "Year of this record"
        - id: Quarter
          type: "text"
          info:
            notes: "Quarter of this record"
        