  dag_owner_name: Mackenzie.Nichols4
  dag_owner_email: mackenzie.nichols4@toronto.ca
  title: PCard Expenditures
  date_published: '2011-06-29 00:37:16.207118'
  dataset_category: Table
  refresh_rate: Monthly
  owner_division: Accounting Services
  owner_section: null
  owner_unit: null
  owner_email: pcard@toronto.ca
  civic_issues: 
    - Fiscal responsibility
  topics:
  - City government
  - Finance
  tags:
  - name: credit card
    vocabulary_id: null
  
  information_url: https://www.toronto.ca/city-government/budget-finances/
  excerpt: The dataset contains details of all purchases made by City staff members using City-issued credit cards also referred to as PCards or purchasing cards.
  limitations: null
  notes: |
    Council PCard expenses are not included in this report. Councillor expenses are disclosed separately through the quarterly Councillor Office Expense Reports.

    PCard expenses for the Offices of the Auditor General, Integrity Commissioner, Lobbyist Registrar and Ombudsman are not included as part of this report. PCard expenses for these offices are posted separately on the websites of the Offices of the Auditor General, Integrity Commissioner, Lobbyist Registrar and Ombudsman.

  resources: 
    PCard Expenses:
      format: xls
      url: https://opendata.toronto.ca/accounting.services/pcard-expenditures/expenditures/PCardExpenses_yyyymm.xls
      custom_reader: pcard_expenditures
      attributes:
        - id: Division
          type: "text"
          info:
            notes: "Name of City of Toronto division"
        - id: Batch-Transaction ID
          type: "text"
          info:
            notes: "Unique identifier assigned by credit card company"
        - id: Transaction Date
          type: "text"
          info:
            notes: "Date of purchase"
        - id: Card Posting Dt
          type: "text"
          info:
            notes: "Date purchase posted by credit card company"
        - id: Merchant Name
          type: "text"
          info:
            notes: "Name of vendor where purchase was made"
        - id: Transaction Amt.
          type: "text"
          info:
            notes: "Amount of purchase in Canadian currency (including amounts after conversion from other currencies)"
        - id: Transaction Currency
          type: "text"
          info:
            notes: "Currency of country"
        - id: Original Amount
          type: "text"
          info:
            notes: "Amount of Purchase in the currency of purchase (pre-exchange)"
        - id: Original Currency
          type: "text"
          info:
            notes: "Currency in which purchase was made"
        - id: G/L Account
          type: "text"
          info:
            notes: "Description of the type of expense made and to be recorded"
        - id: G/L Account Description
          type: "text"
          info:
            notes: "Long text description of the expense"
        - id: Cost Centre / WBS Element / Order Number
          type: "text"
          info:
            notes: 'Represents the Organization Unit or the "where" a Division/Program tracks its revenues and expenditures'
        - id: Cost Centre / WBS Element / Order Number Description
          type: "text"
          info:
            notes: 'Description of the Organization Unit or the "where" a Division/Program recorded its expenditure'
        - id: Merchant Type
          type: "text"
          info:
            notes: "A four-digit number assigned by MasterCard and VISA to a merchant. The MCC is used to classify the business by goods/services it provides."
        - id: Merchant Type Description
          type: "text"
          info:
            notes: "Description of the MCC assigned to the merchant"
        - id: Purpose
          type: "text"
          info:
            notes: "Free-form text describing purchase by the cardholder"
        
        