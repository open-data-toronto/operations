dinesafe:
  schedule: '0 8 * * *'
  dag_owner_name: 'Mackenzie'
  dag_owner_email: 'mackenzie.nichols4@toronto.ca'
  title: Dinesafe
  date_published: '2019-07-23 17:04:01.187902'
  refresh_rate: Daily
  dataset_category: Table
  owner_division: Toronto Public Health
  owner_section: null
  owner_unit: null
  owner_email: PublicHealth@toronto.ca
  civic_issues: null
  topics: 
    - Public safety
    - Health
  tags:
  - name: dinesafe
    vocabulary_id: null
  - name: food
    vocabulary_id: null
  - name: health inspection
    vocabulary_id: null
  - name: restaurant
    vocabulary_id: null
  information_url: https://www.toronto.ca/community-people/health-wellness-care/health-programs-advice/food-safety/dinesafe/
  excerpt: Snapshot of the information to the public concerning the Toronto Public
    Health Food Premises Inspection and Disclosure system. The data set is as current
    as the date of the extraction.
  limitations: Since November 2025, establishments inspected are given a new unique id. Establishments inspected before and after November will have both kinds of ids. Establishments only inspected before will only have one kind of ID.
  notes: "DineSafe is Toronto Public Health\u2019s food safety program that inspects\
    \ all establishments serving and preparing food. Each inspection results in a\
    \ pass, a conditional pass or a closed notice."

  resources:
    # resource name
    Dinesafe:
      format: json
      url: https://secure.toronto.ca/opendata/ds_od/inpections/v2?format=json
      custom_reader: dinesafe
      datastore_upsert:
        primary_key: "unique_id"
      attributes:
        - id: unique_id
          type: text
          info:
            notes: "Unique id for this record connected to source data"
        - id: estId
          type: text
          info:
            notes: "Establishment ID - this will contain either a legacy id or a new one, depending on the system this data currently lives in."
        - id: oldEstId
          type: text
          info:
            notes: "Legacy establishment ID"
        - id: estName
          type: text
          info:
            notes: "Establishment Name"
        - id: address
          type: text
          info:
            notes: "Address of Establishment"
        - id: inspectionStatus
          type: text
          info:
            notes: "Status of the inspection (ex: Pass)"
        - id: phone 
          type: text
          info:
            notes: "Establishment phone number"      
        - id: inspectionDate
          type: date
          format: "%Y-%m-%d"
          info:
            notes: "Date of inspection"
        - id: observation
          type: text          
          info:
            notes: "Observation made during inspection"
        - id: typeDesc
          type: text
          info:
            notes: "Category of infraction"
        - id: deficiencyDesc
          type: text          
          info:
            notes: "Details of infraction"
        - id: severity
          type: text          
          info:
            notes: "Severity of infraction"          
        - id: OutcomeDate
          type: date
          format: "%Y-%m-%d"
          info:
            notes: "Date of outcome of prosecution, if there was one"
        - id: OutcomeDesc
          type: text
          info:
            notes: "Description of outcome, if there was one - this can be 'pending' if an outcome is being processed"
        - id: amountFined
          type: float
          info:
            notes: "Dollar amount of fine given"
        - id: latitude
          type: text
          info:
            notes: ""
        - id: longitude
          type: text
          info:
            notes: ""