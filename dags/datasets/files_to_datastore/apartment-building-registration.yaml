  excerpt: 'This dataset contains building information for rental buildings that are
    registered in the City''s RentSafeTO: Apartment Building Standards program.'
  limitations: null
  notes: "The Apartment Building Standard (ABS) program is based on a new bylaw Chapter\
    \ 354, which defines formal criteria to identify all rental apartment buildings\
    \ in the city with 3 or more storeys and 10 or more units.  The ABS program is\
    \ part of RentSafeTO which is a multi-residential inspection program that establishes\
    \ standards on how building owners operate their building(s) and communicate with\
    \ their tenants, in addition to establishing a schedule for continuous building\
    \ evaluation, audit and enforcement of these standards.\r\n\r\nThis dataset contains\
    \ building information for the buildings that are registered in the ABS program.\
    \ This information was collected from building owners/managers during the initial\
    \ registration process, and is updated on an annual basis as part of the registration\
    \ renewal process.  \r\n\r\n[Read more on the RentSafe Program] (https://www.toronto.ca/311/knowledgebase/kb/docs/articles/municipal-licensing-and-standards/investigation-services/mrab/rentsafeto-apartment-building-standards-program.html)\r\
    \n"
